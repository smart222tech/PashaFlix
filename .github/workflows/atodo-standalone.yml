name: Build Atodo Standalone APKs

on:
  push:
    branches:
      - feature/atodo-standalone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Fire TV and phone APKs
        run: gradle --no-daemon assembleFiretvDebug assemblePhoneDebug
      - name: Upload Fire TV APK (32-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: Atodo-FireTV-ARMv7-APK
          path: app/build/outputs/apk/firetv/debug/app-firetv-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload phone APK (64-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: Atodo-Phone-ARM64-APK
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
