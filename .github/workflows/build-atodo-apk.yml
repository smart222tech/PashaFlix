name: Build Atodo APK

on:
  push:
    branches:
      - main
      - feature/atodo-webview-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal Atodo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official Atodo logo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --connect-timeout 15 https://wals09.github.io/msx/logon/atodo.png -o app/src/main/res/drawable-nodpi/atodo_launcher_logo.png
          file app/src/main/res/drawable-nodpi/atodo_launcher_logo.png

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Atodo-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atodo-Android-APK
          path: dist/Atodo-TV.apk
          if-no-files-found: error
          retention-days: 30
