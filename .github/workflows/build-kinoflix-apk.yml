name: Build KinoFlix APK
on:
  push:
    branches: [feature/kinoflix-three-library-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build universal KinoFlix APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download official Atodo logo for the KinoFlix selector
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --connect-timeout 15 https://wals09.github.io/msx/logon/atodo.png -o app/src/main/res/drawable-nodpi/atodo_logo.png
          file app/src/main/res/drawable-nodpi/atodo_logo.png
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KinoFlix-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KinoFlix-Android-APK
          path: dist/KinoFlix-TV.apk
          if-no-files-found: error
          retention-days: 30
