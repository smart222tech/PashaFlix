name: Build LAMPA Standalone APK
on:
  push:
    branches: [feature/lampa-standalone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build standalone LAMPA APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build LAMPA APK
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LAMPA-Android-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LAMPA-Android-TV-APK
          path: dist/LAMPA-Android-TV.apk
          if-no-files-found: error
          retention-days: 30
